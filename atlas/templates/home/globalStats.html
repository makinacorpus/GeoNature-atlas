{% block globalStats %}
<div id="globalStats" class="card mt-4">
    <div class="card-body">
        <div class="fs-3 card-title"><i class="fas fa-chart-line icon-color-title">&nbsp;</i> {{ _('home.insomefigures') }}
             <div id="mainstat-spinner" class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-6 col-lg-3 stat-object">
                <div class="stat-thumbnail border-end">
                    <i class="fas fa-search fa-3x blue"></i>
                    <input id="hiddenInputTaxonStat" type="hidden" name="cd_ref">
                    <h1 class="large text-muted" id="nbObs"></h1>
                    <div class="fs-5 mb-2 text-muted text-uppercase font-weight-bold">{{ _('observations') }}</div>

                    {% if configuration.AFFICHAGE_DERNIERES_OBS %}
                        <p>
                            <a id="localScroll" href="#DernieresObservations" class="btn btn-secondary" role="button">
                                {{ _('home.seelatestobs') }}
                            </a>
                        </p>
                    {% endif %}
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 stat-object">
                <div class="stat-thumbnail border-end">
                    <i class="fas fa-leaf fa-3x"></i>
                    <h1 class="large text-muted" id="nbTaxons"></h1>
                    <div class="fs-5 mb-2 text-muted text-uppercase font-weight-bold">{{ _('species') }}</div>

                    <form method="POST" class="navbar-form" role="search">
                        <div class="form-group has-feedback center-input">
                            <span class="addon">
                                <i class="fas fa-search"></i>
                            </span>
                            <input id="searchTaxonsStat" type="text" class="form-control"
                                   placeholder="{{ _('search.species') }}&nbsp;&nbsp;&nbsp;" aria-label="{{ _('search.species') }}" loading="false" />
                            <input id="hiddenInputTaxonStat" type="hidden" name="cd_ref">
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 stat-object">
                <div class="stat-thumbnail border-end">
                    <i class="fas fa-map-signs fa-3x blue"></i>
                    <h1 class="large text-muted" id="nbTown"></h1>
                    <div class="fs-5 mb-2 text-muted text-uppercase font-weight-bold">{{ translations.territories }}</div>

                    <form method="POST" onsubmit="completeAction('#searchFormAreasStat', hiddenInputAreasStat)"
                          id='searchFormAreasStat' action="" class="navbar-form center-input" role="search">
                        <div class="form-group has-feedback">
                            <span class="addon">
                                <i class="fas fa-search" aria-hidden="true"></i>
                            </span>
                            <input id="searchAreasStat" type="text" class="form-control"
                                   placeholder="{{ translations.search_area }}&nbsp;&nbsp;&nbsp;" aria-label="{{ translations.search_area }}">
                        </div>
                        <input id="hiddenInputAreasStat" type="hidden" name="id_area">
                    </form>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3 stat-object">
                <div class="stat-thumbnail">
                    <i class="fas fa-camera fa-3x"></i>
                    <h1 class="large text-muted" id="nbPictures"></h1>
                    <div class="fs-5 mb-2 text-muted text-uppercase font-weight-bold">{{ _('photos') }}</div>
                        <button
                            onclick='location.href="{{ url_for('main.photos') }}"'
                            class="btn btn-secondary"
                            title="Voir la galerie photos"
                            style="font-size: var(--bs-btn-font-size);"
                        >
                            {{ _('gallery.title') }}
                        </button>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}
